version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmos
      POSTGRES_PASSWORD: farmos_dev_password
      POSTGRES_DB: farmos
    ports:
      - "5432:5432"
    volumes:
      - farmos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://farmos:farmos_dev_password@postgres:5432/farmos?schema=public"
      JWT_ACCESS_SECRET: "change-me-access-secret"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_SECRET: "change-me-refresh-secret"
      JWT_REFRESH_EXPIRY: "30d"
      BCRYPT_SALT_ROUNDS: "12"
      PORT: "3000"
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"

volumes:
  farmos_pgdata:
